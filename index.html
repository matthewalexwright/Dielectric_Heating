<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dielectric heating</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; padding: 16px; background: #ffffff; color: #000000;
    font-family: Arial, "Liberation Sans", Helvetica, sans-serif; font-size: 15px;
  }
  .wrap { max-width: 650px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; }
  .controls {
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px 12px;
    align-items: center; margin-top: 14px;
  }
  .controls label { white-space: nowrap; }
  .controls output { min-width: 5.5em; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #378ADD; }
  .buttons { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; padding: 6px 14px; border: 1px solid #9A9992; border-radius: 6px;
    background: #ffffff; color: #000000; cursor: pointer;
  }
  button:hover { background: #f3f1ee; }
  button:focus-visible, input:focus-visible { outline: 2px solid #378ADD; outline-offset: 2px; }
  .readout { margin-left: auto; color: #5F5E5A; font-variant-numeric: tabular-nums; }
  i { font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="fig" width="1300" height="1300"
          aria-label="Animation of dielectric heating. The applied field in a solid alternates up and down along a fixed axis. Dipoles turn to follow it but lag behind by the loss angle delta. Below, the phases of the field and polarization are shown as rotating phasors and as two sine waves offset by the same angle."></canvas>

  <div class="controls">
    <label for="delta">Loss angle δ</label>
    <input id="delta" type="range" min="0" max="80" step="1" value="30">
    <output id="deltaOut">30°</output>

    <label for="speed">Speed</label>
    <input id="speed" type="range" min="0.1" max="2" step="0.1" value="0.6">
    <output id="speedOut">0.6×</output>

    <div class="buttons">
      <button id="play" type="button">Pause</button>
      <button id="reset" type="button">Reset to the still frame</button>
      <span class="readout" id="readout"></span>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ settings
  // Geometry is in inches, matching the 3.25 x 3.25 in still figure.
  var W = 3.25, H = 3.25;
  var FIELD_PHASE_START = 0;      // phase of the field in the still frame (0 = maximum, pointing up)
  var N_COLUMNS = 6, N_ROWS = 3;
  var JITTER_DEG = 5;             // random spread in dipole angles
  var FONT_PT = 10;
  var FONT = 'Arial, "Liberation Sans", Helvetica, sans-serif';

  var C_FIELD = "#378ADD", C_POL = "#D85A30", C_BODY = "#888780",
      C_HEAT = [224, 102, 31], C_SLAB = "#FCEFE4", C_LINE = "#9A9992",
      C_TEXT = "#000000", C_MUTED = "#5F5E5A";

  var LW_CURVE = 1.6, LW_PHASOR = 1.8, LW_FIELD = 1.3, LW_THIN = 0.8;   // points

  // -------------------------------------------------------------------- set-up
  var canvas = document.getElementById("fig");
  var ctx = canvas.getContext("2d");
  var S = 1;                      // pixels per inch, set in resize()

  function resize() {
    var cssW = canvas.clientWidth || 650;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssW * dpr * H / W);
    S = canvas.width / W;
    draw();
  }

  // inches (y up) -> canvas pixels (y down)
  function X(x) { return x * S; }
  function Y(y) { return (H - y) * S; }
  function pt(p) { return p / 72 * S; }               // points -> pixels
  function rad(d) { return d * Math.PI / 180; }
  function unit(deg) { var a = rad(deg); return [Math.sin(a), Math.cos(a)]; }
  function add(p, u, k) { return [p[0] + u[0] * k, p[1] + u[1] * k]; }

  // fixed pseudo-random jitter so the dipoles look the same on every load
  var seed = 3;
  function rand() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  function gauss() { return (rand() + rand() + rand() + rand() - 2) * 1.2; }
  var jitter = [];
  for (var i = 0; i < N_COLUMNS * N_ROWS; i++) jitter.push(gauss() * JITTER_DEG);

  // Half the dipoles turn clockwise and half anticlockwise, so that the net
  // polarization stays along the (vertical) field axis.
  var sense = [], order = [];
  for (i = 0; i < N_COLUMNS * N_ROWS; i++) { sense.push(1); order.push(i); }
  for (i = order.length - 1; i > 0; i--) {
    var r = Math.floor(rand() * (i + 1)), tmp = order[i]; order[i] = order[r]; order[r] = tmp;
  }
  for (i = 0; i < order.length / 2; i++) sense[order[i]] = -1;
  var TOP_LEFT = (N_ROWS - 1) * N_COLUMNS;
  if (sense[TOP_LEFT] < 0) { sense[sense.indexOf(1)] = -1; sense[TOP_LEFT] = 1; }

  // -------------------------------------------------------------- draw helpers
  function line(a, b, color, lwPt, dash) {
    ctx.beginPath();
    ctx.moveTo(X(a[0]), Y(a[1])); ctx.lineTo(X(b[0]), Y(b[1]));
    ctx.strokeStyle = color; ctx.lineWidth = pt(lwPt);
    ctx.setLineDash(dash ? dash.map(pt) : []);
    ctx.stroke(); ctx.setLineDash([]);
  }

  function arrow(a, b, color, lwPt, headIn, alpha) {
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    if (L < 1e-6) return;
    var ux = dx / L, uy = dy / L, hl = headIn, hw = headIn * 0.42;
    var base = [b[0] - ux * hl, b[1] - uy * hl];
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.lineCap = "butt";
    line(a, [b[0] - ux * hl * 0.8, b[1] - uy * hl * 0.8], color, lwPt);
    ctx.beginPath();
    ctx.moveTo(X(b[0]), Y(b[1]));
    ctx.lineTo(X(base[0] - uy * hw), Y(base[1] + ux * hw));
    ctx.lineTo(X(base[0] + uy * hw), Y(base[1] - ux * hw));
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    ctx.globalAlpha = 1;
  }

  function roundRect(x, y, w, h, r) {           // x, y = lower-left corner in inches
    var x0 = X(x), y0 = Y(y + h), ww = w * S, hh = h * S, rr = r * S;
    ctx.beginPath();
    ctx.moveTo(x0 + rr, y0);
    ctx.arcTo(x0 + ww, y0, x0 + ww, y0 + hh, rr);
    ctx.arcTo(x0 + ww, y0 + hh, x0, y0 + hh, rr);
    ctx.arcTo(x0, y0 + hh, x0, y0, rr);
    ctx.arcTo(x0, y0, x0 + ww, y0, rr);
    ctx.closePath();
  }

  // text made of [string, italic?] pieces, so E and P can be italic
  function label(x, y, parts, color, align) {
    if (typeof parts === "string") parts = [[parts, false]];
    var px = pt(FONT_PT), widths = [], total = 0, i;
    for (i = 0; i < parts.length; i++) {
      ctx.font = (parts[i][1] ? "italic " : "") + px + "px " + FONT;
      widths.push(ctx.measureText(parts[i][0]).width); total += widths[i];
    }
    var x0 = X(x) - (align === "right" ? total : align === "center" ? total / 2 : 0);
    ctx.fillStyle = color; ctx.textBaseline = "middle"; ctx.textAlign = "left";
    for (i = 0; i < parts.length; i++) {
      ctx.font = (parts[i][1] ? "italic " : "") + px + "px " + FONT;
      ctx.fillText(parts[i][0], x0, Y(y));
      x0 += widths[i];
    }
  }

  function dipole(c, deg) {
    var length = 0.21, width = 0.06, rHead = 0.075;
    var u = unit(deg), tail = add(c, u, -length / 2), tip = add(c, u, length / 2);
    ctx.lineCap = "round";
    line(tail, tip, C_BODY, width * 72);
    ctx.lineCap = "butt";
    ctx.beginPath(); ctx.arc(X(tip[0]), Y(tip[1]), rHead * S, 0, 2 * Math.PI);
    ctx.fillStyle = C_POL; ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = pt(0.6); ctx.stroke();
    var a = 0.6 * rHead, lw = rHead * 72 * 0.24;
    line([tip[0] - a, tip[1]], [tip[0] + a, tip[1]], "#ffffff", lw);
    line([tip[0], tip[1] - a], [tip[0], tip[1] + a], "#ffffff", lw);
  }

  // --------------------------------------------------------------------- state
  var thetaE = FIELD_PHASE_START;   // phase of the field, degrees (shown as an angle only on the phasor diagram)
  var deltaDeg = 30;                // loss angle
  var speed = 0.6;                  // revolutions of the field per ~4 s at 1x
  var playing = true;

  // ---------------------------------------------------------------------- draw
  function draw() {
    var thetaP = thetaE - deltaDeg;
    var heating = Math.abs(Math.sin(rad(deltaDeg)));
    var left = 0.04, right = W - 0.04;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineJoin = "round";

    // ------------------------------------------------------------------- slab
    var sh = 1.36, sy = H - 0.04 - sh;
    roundRect(left, sy, right - left, sh, 0.05);
    ctx.fillStyle = C_SLAB; ctx.fill();

    var dx = (right - left) / (N_COLUMNS + 0.15), dy = 0.37;
    var yMid = sy + sh / 2 + 0.085, xs = [], ys = [], i, j;
    for (i = 0; i < N_COLUMNS; i++)
      xs.push(left + (right - left - (N_COLUMNS - 1) * dx) / 2 + dx * i);
    for (j = 0; j < N_ROWS; j++) ys.push(yMid + dy * (j - (N_ROWS - 1) / 2));

    // heat glow, clipped to the slab; brighter for larger loss angle
    ctx.save();
    roundRect(left, sy, right - left, sh, 0.05); ctx.clip();
    if (heating > 0) {
      for (j = 0; j < N_ROWS; j++) for (i = 0; i < N_COLUMNS; i++) {
        var gx = X(xs[i]), gy = Y(ys[j]), gr = 0.30 * S;
        var g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
        var a0 = 0.62 * heating;
        g.addColorStop(0, "rgba(" + C_HEAT + "," + a0 + ")");
        g.addColorStop(0.35, "rgba(" + C_HEAT + "," + a0 * 0.42 + ")");
        g.addColorStop(1, "rgba(" + C_HEAT + ",0)");
        ctx.fillStyle = g; ctx.fillRect(gx - gr, gy - gr, 2 * gr, 2 * gr);
      }
    }
    ctx.restore();
    roundRect(left, sy, right - left, sh, 0.05);
    ctx.strokeStyle = C_LINE; ctx.lineWidth = pt(LW_THIN); ctx.stroke();

    // applied field arrows, in the lanes between dipole columns. The field is
    // linearly polarized: the arrows stay vertical and only change size and sign.
    var amp = Math.cos(rad(thetaE)), half = 0.40, up = [0, 1];
    if (Math.abs(amp) > 0.04) {
      var headLen = Math.min(0.085, 2 * half * Math.abs(amp) * 0.6);
      for (i = 0; i < N_COLUMNS - 1; i++) {
        var c = [(xs[i] + xs[i + 1]) / 2, yMid];
        arrow(add(c, up, -half * amp), add(c, up, half * amp), C_FIELD, LW_FIELD, headLen, 0.9);
      }
    }

    // dipoles turn to follow the field, trailing it by delta
    var n = 0;
    for (j = 0; j < N_ROWS; j++) for (i = 0; i < N_COLUMNS; i++) {
      dipole([xs[i], ys[j]], sense[n] * thetaP + jitter[n]); n++;
    }

    // curved arrow on the top-left dipole: the way it is turning to follow the field
    if (deltaDeg > 0) {
      var cc = [xs[0], ys[N_ROWS - 1]], rArc = 0.19;
      var pTip = thetaP + jitter[TOP_LEFT];
      var a1 = pTip + 42, a2 = pTip + 90, pts = [], k;
      for (k = 0; k <= 30; k++) pts.push(add(cc, unit(a1 + (a2 - a1) * k / 30), rArc));
      ctx.beginPath(); ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
      for (k = 1; k <= 27; k++) ctx.lineTo(X(pts[k][0]), Y(pts[k][1]));
      ctx.strokeStyle = C_TEXT; ctx.lineWidth = pt(1.1); ctx.stroke();
      arrow(pts[26], pts[30], C_TEXT, 1.1, 0.07);
    }

    label(right - 0.08, sy + 0.115, "Dipole", C_BODY, "right");

    // ---------------------------------------------------- phasors and traces
    var o = [0.64, 0.93], RE = 0.52, RP = 0.41, xTr = 1.36;
    ctx.beginPath(); ctx.arc(X(o[0]), Y(o[1]), RE * S, 0, 2 * Math.PI);
    ctx.strokeStyle = C_LINE; ctx.lineWidth = pt(LW_THIN); ctx.stroke();
    line([o[0] - RE - 0.06, o[1]], [right, o[1]], C_LINE, LW_THIN);
    line([xTr, o[1] - RE - 0.04], [xTr, o[1] + RE + 0.04], C_LINE, LW_THIN);
    line([o[0], o[1] + RE - 0.04], [o[0], o[1] + RE + 0.04], C_MUTED, 1.0);
    label(o[0] - 0.02, o[1] + RE + 0.13, "0°", C_MUTED, "center");

    var tipE = add(o, unit(thetaE), RE), tipP = add(o, unit(thetaP), RP);

    // time traces: "now" is at the left edge, earlier times lie to the right
    var kWave = 2 * Math.PI / 1.22, phE = rad(thetaE), d = rad(deltaDeg);
    function trace(R, shift, color) {
      ctx.beginPath();
      for (var q = 0; q <= 300; q++) {
        var x = xTr + (right - xTr) * q / 300;
        var y = o[1] + R * Math.cos(phE - kWave * (x - xTr) - shift);
        if (q === 0) ctx.moveTo(X(x), Y(y)); else ctx.lineTo(X(x), Y(y));
      }
      ctx.strokeStyle = color; ctx.lineWidth = pt(LW_CURVE); ctx.stroke();
    }
    trace(RE, 0, C_FIELD);
    trace(RP, d, C_POL);

    [[tipE, C_FIELD], [tipP, C_POL]].forEach(function (t) {
      line(t[0], [xTr, t[0][1]], t[1], LW_THIN, [3, 2]);
      ctx.beginPath(); ctx.arc(X(xTr), Y(t[0][1]), pt(1.9), 0, 2 * Math.PI);
      ctx.fillStyle = t[1]; ctx.fill();
    });

    arrow(o, tipP, C_POL, LW_PHASOR, 0.11);
    arrow(o, tipE, C_FIELD, LW_PHASOR, 0.11);
    label.apply(null, add(o, unit(thetaE + 17), RE + 0.15).concat([[["E", true]], C_FIELD, "center"]));
    // P label sits beside its arrowhead, on the left so it stays clear of the dashed guide
    var side = unit(thetaP - 90)[0] <= unit(thetaP + 90)[0] ? thetaP - 90 : thetaP + 90;
    label.apply(null, add(add(o, unit(thetaP), RP + 0.02), unit(side), 0.13)
      .concat([[["P", true]], C_POL, "center"]));

    // loss-angle arc and label between the two phasors
    if (deltaDeg > 0) {
      ctx.beginPath();
      ctx.arc(X(o[0]), Y(o[1]), 0.19 * S, rad(thetaP - 90), rad(thetaE - 90));
      ctx.strokeStyle = C_TEXT; ctx.lineWidth = pt(1.0); ctx.stroke();
      var m = add(o, unit((thetaE + thetaP) / 2), 0.30);
      label(m[0], m[1], "δ", C_TEXT, "center");
    }

    // ------------------------------------------------------------ text labels
    var ly = 0.16;
    label(left, ly, "Phase", C_TEXT, "left");
    label(right, o[1] + RE + 0.13, "Time", C_TEXT, "right");
    label(xTr - 0.30, ly, [["Polarization ", false], ["P", true]], C_POL, "left");
    label(right, ly, [["Applied field ", false], ["E", true]], C_FIELD, "right");
  }

  // ----------------------------------------------------------------- animation
  var last = null;
  function frame(now) {
    if (playing) {
      if (last !== null) {
        var dt = Math.min((now - last) / 1000, 0.1);
        thetaE = (thetaE + 90 * speed * dt) % 360;      // clockwise
      }
      last = now;
      draw();
    } else {
      last = null;
    }
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------ controls
  var playBtn = document.getElementById("play");
  var deltaIn = document.getElementById("delta"), deltaOut = document.getElementById("deltaOut");
  var speedIn = document.getElementById("speed"), speedOut = document.getElementById("speedOut");
  var readout = document.getElementById("readout");

  function updateReadout() {
    deltaOut.textContent = deltaDeg + "°";
    speedOut.textContent = speed.toFixed(1) + "×";
    readout.textContent = "tan δ = " + Math.tan(rad(deltaDeg)).toFixed(2);
  }
  function setPlaying(p) { playing = p; playBtn.textContent = p ? "Pause" : "Play"; }

  playBtn.addEventListener("click", function () { setPlaying(!playing); });
  document.getElementById("reset").addEventListener("click", function () {
    setPlaying(false); thetaE = FIELD_PHASE_START; deltaDeg = 30; deltaIn.value = 30;
    updateReadout(); draw();
  });
  deltaIn.addEventListener("input", function () {
    deltaDeg = Number(deltaIn.value); updateReadout(); draw();
  });
  speedIn.addEventListener("input", function () {
    speed = Number(speedIn.value); updateReadout();
  });
  window.addEventListener("resize", resize);

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)
    setPlaying(false);

  updateReadout();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
